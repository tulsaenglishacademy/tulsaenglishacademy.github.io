<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750A4"><title>Texting Tutor | Tulsa English Academy</title>
<style>
:root{--p:#6750A4;--bg:#FFFBFE;--txt:#1C1B1F;--mut:#49454F;--lav:#E8DEF8;--soft:#F3EDF7;--fill:#E7E0EC}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Roboto,Arial,sans-serif;color:var(--txt);background:linear-gradient(135deg,#f3ecfb,#fff 48%,#eee4fa);overflow:hidden}button,input{font:inherit}button{min-height:44px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b69df8;outline-offset:2px}
.app{height:100dvh;max-width:900px;margin:auto;padding:16px}.chat-shell{height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 14px 45px #3d2b521f}
header{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid #e5dfe7;background:#fffbfef5}.logo{width:48px;height:48px;object-fit:contain;background:var(--p);border-radius:14px;padding:5px}.head{flex:1;min-width:0}.head b{display:block}.head small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sim{font-size:10px;color:var(--p);font-weight:800}.head-actions{display:flex;gap:6px}.pill{border:0;border-radius:999px;background:var(--soft);color:var(--p);padding:0 13px;font-weight:700}
.privacy{text-align:center;color:var(--mut);font-size:12px;padding:5px}.messages{flex:1;min-height:0;overflow:auto;padding:18px 16px 28px;scroll-behavior:smooth}.row{display:flex;margin:9px 0}.student{justify-content:flex-end}.bubble{max-width:min(78%,600px);padding:11px 14px;border-radius:20px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}.tutor .bubble{background:var(--soft);border-bottom-left-radius:6px}.student .bubble{background:var(--p);color:white;border-bottom-right-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:1px solid #c8b7e5;border-radius:999px;background:white;color:var(--p);padding:8px 13px;font-weight:700}.typing{display:flex;gap:4px;width:max-content;padding:13px 16px;background:var(--soft);border-radius:20px}.typing i{width:6px;height:6px;border-radius:50%;background:#777;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-4px);opacity:.45}}
.composer{border-top:1px solid #e5dfe7;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#fffbfef8}.tools{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tool{border:0;border-radius:999px;background:var(--soft);color:var(--mut);padding:6px 11px;white-space:nowrap;font-size:13px}.sendrow{display:flex;gap:8px}.sendrow input{min-width:0;flex:1;height:50px;border:0;border-radius:25px;background:var(--fill);padding:0 18px}.send{border:0;border-radius:25px;background:var(--p);color:#fff;padding:0 21px;font-weight:800}
.modal{position:fixed;inset:0;background:#1c1b1f55;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.card{width:min(480px,100%);background:var(--bg);border-radius:25px;padding:22px}.card p{color:var(--mut)}.card-actions{display:flex;justify-content:flex-end;gap:8px}.danger{border:0;border-radius:999px;background:#f9dedc;color:#b3261e;padding:0 15px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:600px){.app{padding:0}.chat-shell{border-radius:0}.bubble{max-width:87%}.desktop{display:none}.messages{padding-left:12px;padding-right:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="app"><section class="chat-shell" aria-label="Tulsa English Academy texting tutor">
<header><img class="logo" src="../tulsa-logo-white.png" alt="Tulsa English Academy logo"><div class="head"><b>Maya <span class="sim">SIMULATED ENGLISH TUTOR</span></b><small id="subject">Choose a practice subject</small></div><div class="head-actions"><button class="pill desktop" id="change">Subject</button><button class="pill" id="clear">Clear</button></div></header>
<div class="privacy">Private practice • Saved only on this device • No account required</div><div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
<div class="composer"><div class="tools"><button class="tool" data-help="es">🇪🇸 Spanish Help</button><button class="tool" data-help="simple">Simpler English</button><button class="tool" data-help="answer">Help me answer</button><button class="tool" data-help="another">Another question</button><button class="tool" data-help="recap">Recap</button></div><form id="form" class="sendrow"><label class="sr" for="input">Type your reply</label><input id="input" maxlength="400" autocomplete="off" placeholder="Type a message…"><button class="send">Send</button></form></div>
</section></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card"><h2>Clear this chat?</h2><p>This removes the saved conversation and selected subject from this device.</p><div class="card-actions"><button class="pill" id="cancel">Cancel</button><button class="danger" id="confirm">Clear chat</button></div></div></div>
<script>
const KEY="tea_texting_tutor_v2";
const curriculum={"BE VERBS":["Am / is / are","Was / were","There is / there are","There was / there were"],"PRESENT":["Simple present","Present continuous","Simple present versus present continuous"],"PAST":["Simple past: regular verbs","Simple past: irregular verbs","Past continuous","Simple past versus past continuous"],"PERFECT TENSES":["Present perfect","Ever / never","Already / yet / still","Since / for","Present perfect versus simple past"],"FUTURE":["Going to","Will","Present continuous for future arrangements"],"ABILITY, ADVICE, AND OBLIGATIONS":["Can / could","Should","Must / have to","Permission and requests"],"DESCRIBING AND COMPARING":["Adjectives","Adverbs","Comparatives","Superlatives"],"PEOPLE, THINGS, AND QUANTITIES":["Pronouns","Possessives","Articles","Countable and uncountable nouns","Some / any","Much / many"],"TIME, PLACE, AND HABITS":["Prepositions","Frequency adverbs","Past-time expressions"],"EVERYDAY EXPRESSIONS":["Phrasal verbs","Common phrases","Natural greetings and responses"],"LATER-LEVEL SUBJECTS":["Past perfect","Conditionals","Passive voice","Reported speech"]};
const L={
present:{name:"Am / is / are",es:"Usamos am/is/are para identidad, estado, descripción y ubicación.",structures:["I am","you/we/they are","he/she/it is"],suggest:["I’m at home.","It’s pretty busy.","My favorite snack is fruit."],qs:[["location","Are you home or out somewhere?","¿Estás en casa o en algún lugar afuera?"],["day","How’s your day? Is it busy or pretty relaxed?","¿Cómo va tu día? ¿Está ocupado o tranquilo?"],["food","What’s your favorite snack?","¿Cuál es tu merienda favorita?"],["mood","How are you feeling today?","¿Cómo te sientes hoy?"],["weather","What’s the weather like where you are?","¿Cómo está el clima donde estás?"],["people","Who’s someone you’re close to? What are they like?","¿Quién es alguien cercano a ti? ¿Cómo es?"],["routine","Are your mornings usually busy?","¿Tus mañanas suelen ser ocupadas?"]]},
pastbe:{name:"Was / were",es:"Was y were son el pasado de be. Usa was con I/he/she/it y were con you/we/they.",structures:["I/he/she/it was","you/we/they were","wasn't/weren't"],suggest:["It was busy.","I was at home.","They were really nice."],qs:[["day","How was your day yesterday?","¿Cómo estuvo tu día ayer?"],["weekend","Was your last weekend busy or relaxing?","¿Tu último fin de semana fue ocupado o relajante?"],["location","Where were you last Saturday afternoon?","¿Dónde estabas el sábado pasado por la tarde?"],["food","What was the best thing you ate recently?","¿Qué fue lo mejor que comiste recientemente?"],["mood","Were you tired when you woke up this morning?","¿Estabas cansado/a cuando te despertaste esta mañana?"],["people","Think of a recent celebration. Who was there?","Piensa en una celebración reciente. ¿Quién estaba allí?"],["weather","What was the weather like yesterday?","¿Cómo estuvo el clima ayer?"]]},
irregular:{name:"Simple past: irregular verbs",es:"Los verbos irregulares cambian en pasado: go→went, eat→ate, see→saw. Después de did/didn't, usa la forma base.",structures:["go → went","come → came","eat → ate","see → saw","get → got"],suggest:["I went to the store.","I ate chicken and rice.","My friend came over."],qs:[["weekend","Where did you go last weekend?","¿Adónde fuiste el fin de semana pasado?"],["food","What did you eat yesterday that was really good?","¿Qué comiste ayer que estuvo muy bueno?"],["people","Who came to your last birthday or celebration?","¿Quién vino a tu último cumpleaños o celebración?"],["buy","What’s something useful you bought recently?","¿Qué cosa útil compraste recientemente?"],["see","What’s the last good movie or show you saw?","¿Cuál fue la última película o serie buena que viste?"],["get","Did you get any good news recently?","¿Recibiste alguna buena noticia recientemente?"],["take","What did you take with you the last time you went out for the day?","¿Qué llevaste contigo la última vez que saliste?"],["make","What did you make for dinner the last time you cooked?","¿Qué preparaste para cenar la última vez que cocinaste?"]]}
};
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{lesson:null,msg:[],used:{},current:null,fixes:[]};const M=document.getElementById("messages"),I=document.getElementById("input"),SUB=document.getElementById("subject");
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));function add(role,text){S.msg.push({role,text});save();render()}
function render(){M.replaceChildren();S.msg.forEach(m=>{let r=document.createElement("div");r.className="row "+m.role;let b=document.createElement("div");b.className="bubble";b.textContent=m.text;r.append(b);M.append(r)});if(!S.lesson&&S.msg.length)choices();SUB.textContent=S.lesson?L[S.lesson].name:"Choose a practice subject";requestAnimationFrame(()=>M.scrollTop=M.scrollHeight)}
function choices(){let d=document.createElement("div");d.className="chips";[["present","Am / is / are"],["pastbe","Was / were"],["irregular","Simple past: irregular verbs"]].forEach(([id,label])=>{let b=document.createElement("button");b.className="chip";b.textContent=label;b.onclick=()=>choose(id);d.append(b)});M.append(d)}
function typing(fn){let r=document.createElement("div");r.className="row tutor";r.innerHTML='<div class="typing" aria-label="Tutor is typing"><i></i><i></i><i></i></div>';M.append(r);M.scrollTop=M.scrollHeight;setTimeout(()=>{r.remove();fn()},500+Math.random()*500)}
function choose(id){S.lesson=id;S.current=null;add("student","Let’s practice "+L[id].name+".");typing(()=>{add("tutor","Sounds good. We’ll keep it conversational.");next()})}
function next(){let q=L[S.lesson].qs,u=S.used[S.lesson]||[],opts=q.map((x,i)=>[x,i]).filter(x=>!u.includes(x[1]));if(!opts.length){u=[];opts=q.map((x,i)=>[x,i])}let [p,i]=opts[Math.floor(Math.random()*opts.length)];S.used[S.lesson]=u.concat(i).slice(-6);S.current={tag:p[0],q:p[1],es:p[2]};save();add("tutor",p[1])}
const clean=s=>s.toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
function correction(t){let s=clean(t);if(S.lesson==="present"){if(/\bi is\b/.test(s))return["You can say: “I am” or “I’m.”","Use am with I."];if(/\b(you|we|they) is\b/.test(s))return["Try: “"+t.replace(/\bis\b/i,"are")+"”","Use are with you, we, and they."];if(/\b(he|she|it) are\b/.test(s))return["Try: “"+t.replace(/\bare\b/i,"is")+"”","Use is with he, she, and it."]}if(S.lesson==="pastbe"){if(/\b(i|he|she|it) were\b/.test(s))return["Try: “"+t.replace(/\bwere\b/i,"was")+"”","Use was with I, he, she, and it."];if(/\b(you|we|they|friends|people|kids|parents) was\b/.test(s))return["Try: “"+t.replace(/\bwas\b/i,"were")+"”","Use were with you and plural subjects."]}if(S.lesson==="irregular"){let m=s.match(/\bdid\s+(went|ate|saw|came|got|took|bought|made|had|gave)\b/),map={went:"go",ate:"eat",saw:"see",came:"come",got:"get",took:"take",bought:"buy",made:"make",had:"have",gave:"give"};if(m)return["You can say: “"+t.replace(new RegExp("\\b"+m[1]+"\\b","i"),map[m[1]])+"”","After did, use the base verb."]}return null}
function ack(t){let s=clean(t);if(/busy/.test(s))return"Sounds like you had a lot going on.";if(/tired|exhausted/.test(s))return"Sounds like you needed some rest 😅";if(/good|great|nice|fun|relax/.test(s))return"That sounds nice.";if(/^(no|nope|not really)/.test(s))return"Gotcha.";return["Got it.","I see.","Nice—thanks for telling me."][Math.floor(Math.random()*3)]}
function follow(t){let s=clean(t),tag=S.current?.tag;if(s.length<3||/^(idk|i don't know|i dont know|not sure)$/.test(s))return"No problem. Want an easier version of the question?";if(tag==="day")return/\bbusy\b/.test(s)?"Was it busy all day, or only part of the day?":"What made it feel that way?";if(tag==="weekend")return/relax|home|quiet/.test(s)?"What was the most relaxing part?":"Who were you with?";if(tag==="location")return"What do you like about that place?";if(tag==="food")return S.lesson==="irregular"?"Who did you eat with?":"Why was it memorable?";if(tag==="people")return S.lesson==="irregular"?"Who did you talk to the most?":"What were they like?";if(tag==="mood")return"What made you feel that way?";if(tag==="weather")return"Was that good weather for you?";if(tag==="buy")return"Where did you buy it?";if(tag==="see")return"Who did you watch it with?";if(tag==="get")return"How did you feel when you got the news?";if(tag==="take")return"Did you use everything you took?";if(tag==="make")return"Who ate it with you?";return"Tell me a little more about that."}
function reply(t){let c=correction(t),o=ack(t);if(c){o+="\n\n"+c[0]+" "+c[1];S.fixes.push(c[0]);S.fixes=S.fixes.slice(-6)}o+="\n\n"+follow(t);add("tutor",o)}
document.getElementById("form").onsubmit=e=>{e.preventDefault();let t=I.value.trim();if(!t)return;I.value="";add("student",t);typing(()=>reply(t))};
document.querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>{if(!S.lesson){add("tutor","Choose a subject first, and I’ll help from there.");return}let l=L[S.lesson],h=b.dataset.help;if(h==="es")add("tutor",(S.current?.es||l.es)+"\n\nGrammar help: "+l.es);if(h==="simple")add("tutor","Sure. Let’s make it simpler:\n\n"+(S.lesson==="present"?"How are you today?":S.lesson==="pastbe"?"How was yesterday?":"Where did you go yesterday?"));if(h==="answer")add("tutor","You could start with one of these:\n• "+l.suggest.join("\n• "));if(h==="another")typing(next);if(h==="recap")add("tutor","Quick practice recap — "+l.name+"\n\n"+(S.fixes.length?"Useful corrected sentences:\n• "+S.fixes.slice(-3).join("\n• "):"You haven’t needed any saved target-grammar corrections yet.")+"\n\nKeep using: "+l.structures.slice(0,3).join(" • "))});
document.getElementById("change").onclick=()=>{S.lesson=null;S.current=null;add("tutor","Sure—what would you like to practice now?")};document.getElementById("clear").onclick=()=>document.getElementById("modal").classList.add("open");document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("open");document.getElementById("confirm").onclick=()=>{localStorage.removeItem(KEY);S={lesson:null,msg:[],used:{},current:null,fixes:[]};document.getElementById("modal").classList.remove("open");start()};
function start(){if(S.msg.length){render();return}let a=["Hey! Up for a little English practice?","Hi there 😊 What are we practicing today?","Got a few minutes to chat?","Hey, how’s it going? Want to practice a little English?"];add("tutor",a[Math.floor(Math.random()*a.length)]+"\n\nChoose a subject whenever you’re ready.")}start();
</script></body></html>
